<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Potente · Operación en feria</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#120805">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
:root{
  color-scheme: dark;
  /* Paleta de la web de Potente (potente/equipo/index.html), sin inventar tonos nuevos */
  --carbon:#120805; --carbon-hondo:#0a0403; --plancha:#1b0d07; --plancha-alta:#24130a;
  --linea-web:#3d2214;
  --f-display:"Anton","Arial Narrow",Impact,sans-serif;
  --f-body:"Barlow","Helvetica Neue",Arial,sans-serif;
  --f-util:"Barlow Condensed","Arial Narrow",Arial,sans-serif;

  --bg:#120805;
  --panel:#1b0d07;
  --panel-2:#24130a;
  --panel-3:#2e1a0f;
  --line:#3d2214;
  --line-2:#55301c;
  --ink:#f7ead9;
  --ink-2:#e0cab3;
  --ink-3:#ab917c;
  --crema:#f7ead9;
  --fuego:#f2811d;
  --brasa:#ffc63c;
  --grad:linear-gradient(140deg,#ffc63c,#f2811d 55%,#d63317);
  /* medios de pago — orden validado para daltonismo sobre fondo oscuro */
  --p-qr:#9085e9;
  --p-pos:#199e70;
  --p-tarjeta:#3987e5;
  --p-efectivo:#c98500;
  --ok:#2fbf6b;
  --warn:#e0a32e;
  --bad:#c2452f;
  --r:14px;
  --shadow:0 10px 30px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
body{
  margin:0;
  background:
    radial-gradient(120% 70% at 50% -10%, #241a13 0%, rgba(36,26,19,0) 60%),
    radial-gradient(90% 50% at 100% 100%, #1b1410 0%, rgba(27,20,16,0) 70%),
    var(--bg);
  background-attachment:fixed;
  color:var(--ink);
  font-family:var(--f-body);
  font-size:16px;
  line-height:1.45;
  -webkit-text-size-adjust:100%;
  min-height:100vh;
}
h1,h2,h3,.display{font-family:var(--f-display);font-weight:400;letter-spacing:.01em;text-transform:uppercase;margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--brasa);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.hide{display:none !important}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important}}

/* ---------- shell ---------- */
.wrap{max-width:1280px;margin:0 auto;padding:0 16px}
.top{
  position:sticky;top:0;z-index:40;
  background:rgba(14,11,10,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.top-in{max-width:1280px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.logomark{background-image:url("../../img/logo.png");background-repeat:no-repeat;background-position:left center;background-size:contain}
.brand{height:26px;width:82px;flex:none}
.top-sep{flex:1}
.chip{
  display:inline-flex;align-items:center;gap:7px;
  padding:5px 11px;border:1px solid var(--line-2);border-radius:999px;
  font-size:12.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);
  background:var(--panel);white-space:nowrap;
}
.chip b{color:var(--ink);font-weight:600}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none;box-shadow:0 0 0 3px rgba(47,174,78,.18)}
.chip.off .dot{background:var(--ink-3);box-shadow:none}
.chip-btn{cursor:pointer}
.chip-btn:hover{border-color:var(--fuego);color:var(--ink)}
.chip-role{border-color:var(--line-2);color:var(--ink);gap:8px;padding-right:9px}
.chip-role svg{width:14px;height:14px;flex:none;color:var(--fuego)}
.chip-role .cambiar{color:var(--ink-3);border-left:1px solid var(--line-2);padding-left:8px}
@media (max-width:520px){.chip-role .cambiar{display:none}}

/* ---------- portada / roles ---------- */
.gate{min-height:88vh;display:flex;flex-direction:column;justify-content:center;padding:48px 16px 40px;max-width:980px;margin:0 auto}
.gate .logo{width:min(260px,60vw);height:min(100px,23vw);margin-bottom:22px}
.gate .kicker{font-size:12.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--fuego);font-weight:600;margin-bottom:8px}
.gate h1{font-size:clamp(34px,7vw,58px);line-height:.95;margin-bottom:10px}
.gate p.lead{color:var(--ink-2);max-width:56ch;margin:0 0 28px}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:760px){.roles{grid-template-columns:1fr}}
.role{
  text-align:left;padding:20px 18px 18px;border-radius:var(--r);
  background:linear-gradient(180deg,var(--panel-2),var(--panel));
  border:1px solid var(--line);transition:border-color .15s,transform .15s;
  display:flex;flex-direction:column;gap:6px;min-height:150px;
}
.role:hover{border-color:var(--fuego);transform:translateY(-2px)}
.role .rn{font-family:var(--f-display);text-transform:uppercase;font-size:26px;line-height:1}
.role .rd{color:var(--ink-2);font-size:14.5px}
.role .rdev{margin-top:auto;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.role .ico{width:34px;height:34px;margin-bottom:4px;color:var(--fuego)}

/* ---------- genéricos ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.sec-h{display:flex;align-items:baseline;gap:10px;margin:26px 0 12px;flex-wrap:wrap}
.sec-h h2{font-size:20px}
.sec-h .sub{color:var(--ink-3);font-size:13px}
.lbl{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 18px;border-radius:11px;font-weight:700;font-size:15px;
  background:var(--panel-3);border:1px solid var(--line-2);color:var(--ink);
}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--grad);color:#17130F;border:0;text-transform:uppercase;letter-spacing:.03em}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.sm{padding:7px 12px;font-size:13.5px;border-radius:9px}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.peligro{color:#e88a8a;border-color:#5a2727}
.btn.peligro:hover{border-color:var(--bad);color:#ff9a9a}
.btn.destruir{background:var(--bad);color:#fff;border:0;text-transform:uppercase;letter-spacing:.03em}
.btn.destruir:hover{filter:brightness(1.1)}
.banner{padding:9px 16px;font-size:13.5px;text-align:center;background:#3a2a10;color:var(--brasa);border-bottom:1px solid #5a4318}
.empty{padding:40px 20px;text-align:center;color:var(--ink-3)}
.empty .big{font-family:var(--f-display);font-size:22px;color:var(--ink-2);text-transform:uppercase;margin-bottom:6px}

/* ---------- avance del equipo ---------- */
.equipo{display:flex;align-items:center;gap:14px;margin:12px 0 2px;padding:11px 15px;border-radius:14px;
  border:1px solid #6a4a1c;background:linear-gradient(150deg,#33210c,var(--panel) 70%)}
.equipo.logrado{border-color:#24603a;background:linear-gradient(150deg,#0f2a1a,var(--panel) 70%);animation:festejo 1.2s ease 2}
@keyframes festejo{0%,100%{box-shadow:0 0 0 0 rgba(47,174,78,0)}50%{box-shadow:0 0 0 5px rgba(47,174,78,.22)}}
.equipo .cara{font-size:34px;line-height:1;flex:none}
.equipo .eq-b{flex:1;min-width:0}
.equipo .eq-t{display:flex;align-items:baseline;gap:10px;margin-bottom:7px}
.equipo .eq-t b{font-family:var(--f-display);text-transform:uppercase;font-size:15px;letter-spacing:.03em;font-weight:400}
.equipo .eq-t span{margin-left:auto;font-size:13px;color:var(--ink-2);font-weight:600}
.equipo .eq-bar{position:relative;height:12px;border-radius:7px;background:var(--panel-3);border:1px solid var(--line)}
.equipo .eq-fill{height:100%;border-radius:7px;background:var(--grad);transition:width .6s cubic-bezier(.2,.8,.3,1)}
.equipo.logrado .eq-fill{background:linear-gradient(90deg,#1f7a45,#2fae4e);box-shadow:0 0 14px rgba(47,174,78,.4)}
.equipo .eq-tick{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--crema);opacity:.55;border-radius:2px}
.equipo .eq-tick::after{content:"costos";position:absolute;top:-14px;left:50%;transform:translateX(-50%);
  font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}

/* ---------- CAJA ---------- */
.caja{padding-bottom:132px}
.cats{display:flex;gap:8px;overflow-x:auto;padding:12px 0 10px;position:sticky;top:47px;z-index:30;background:linear-gradient(180deg,var(--bg) 70%,rgba(14,11,10,0));scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{padding:7px 14px;border-radius:999px;border:1px solid var(--line-2);white-space:nowrap;font-size:14px;font-weight:600;color:var(--ink-2)}
.cat[aria-pressed="true"]{background:var(--grad);color:#17130F;border-color:transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:10px}
.prod{
  text-align:left;padding:13px 13px 11px;border-radius:12px;background:var(--panel);
  border:1px solid var(--line);display:flex;flex-direction:column;gap:3px;min-height:112px;
  transition:transform .08s,border-color .15s;position:relative;overflow:hidden;
}
.prod:active{transform:scale(.975)}
.prod:hover{border-color:var(--line-2)}
.prod .pn{font-family:var(--f-display);text-transform:uppercase;font-size:16.5px;line-height:1.08;letter-spacing:.005em;padding-right:56px}
.prod .pd{font-size:12.5px;color:var(--ink-3);line-height:1.25}
.prod .pp{margin-top:auto;font-family:var(--f-display);font-size:19px;color:var(--brasa)}
.prod .pp small{font-size:11px;color:var(--ink-3);font-family:var(--f-body);letter-spacing:.08em;text-transform:uppercase;margin-left:5px}
.prod.combo{background:linear-gradient(150deg,#33210c,var(--panel) 62%);border-color:#6a4a1c}
.prod .opts-tag{position:absolute;top:9px;right:9px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);border:1px solid var(--line-2);border-radius:999px;padding:1px 6px}
.prod .qty-badge{position:absolute;top:8px;right:8px;background:var(--fuego);color:#17130F;font-family:var(--f-display);font-size:13px;min-width:22px;height:22px;border-radius:999px;display:grid;place-items:center;padding:0 5px}

/* barra carrito */
.cartbar{
  position:fixed;left:0;right:0;bottom:0;z-index:45;
  background:rgba(23,19,15,.97);backdrop-filter:blur(12px);border-top:1px solid var(--line-2);
  box-shadow:0 -14px 34px rgba(0,0,0,.5);
}
.cartbar-in{max-width:1280px;margin:0 auto;padding:11px 16px calc(11px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px}
.cart-sum{flex:1;min-width:0;text-align:left}
.cart-sum .cs1{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.cart-sum .cs2{display:block;font-family:var(--f-display);font-size:25px;line-height:1.05}
.cart-lines{max-height:44vh;overflow:auto;border-bottom:1px solid var(--line);padding:6px 16px 10px;max-width:1280px;margin:0 auto}
.line{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.line .ln{flex:1;min-width:0}
.line .ln b{display:block;font-weight:600;font-size:15px}
.line .ln span{font-size:12.5px;color:var(--ink-2);display:block}
.line .lp{font-family:var(--f-display);font-size:16px;min-width:64px;text-align:right}
.step{display:flex;align-items:center;gap:2px;background:var(--panel-3);border-radius:9px;padding:2px}
.step button{width:30px;height:30px;border-radius:7px;font-size:19px;line-height:1;display:grid;place-items:center;color:var(--ink-2)}
.step button:hover{background:var(--line);color:var(--ink)}
.step .q{min-width:24px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(8,6,5,.72);z-index:60;display:flex;align-items:flex-end;justify-content:center;padding:0;animation:fade .15s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{
  width:100%;max-width:620px;background:var(--panel);border:1px solid var(--line-2);
  border-radius:18px 18px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom));
  max-height:92vh;overflow:auto;animation:up .18s cubic-bezier(.2,.8,.3,1);
}
@media (min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:18px}}
@keyframes up{from{transform:translateY(26px)}to{transform:translateY(0)}}
.sheet h3{font-size:23px;margin-bottom:2px}
.sheet .sh-sub{color:var(--ink-2);font-size:14px;margin-bottom:16px}
.optgrp{margin-bottom:16px}
.optgrp .lbl{display:block;margin-bottom:7px}
.optrow{display:flex;flex-wrap:wrap;gap:8px}
.opt{padding:11px 15px;border-radius:11px;border:1px solid var(--line-2);background:var(--panel-2);font-weight:600;font-size:15px}
.opt[aria-pressed="true"]{border-color:var(--fuego);background:#33210c;color:var(--brasa)}
.pays{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.pay{
  display:flex;align-items:center;gap:10px;padding:14px 13px;border-radius:12px;
  border:1px solid var(--line-2);background:var(--panel-2);text-align:left;font-weight:600;
}
.pay .sw{width:13px;height:13px;border-radius:4px;flex:none}
.pay[aria-pressed="true"]{border-color:currentColor;background:var(--panel-3)}
.pay small{display:block;font-weight:500;font-size:11.5px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase}
.ticket-ok{text-align:center;padding:22px 10px 8px}
.ticket-ok .tn{font-family:var(--f-display);font-size:74px;line-height:.9;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.ticket-ok .tt{font-family:var(--f-display);text-transform:uppercase;font-size:19px;margin-top:6px}
.ticket-ok .td{color:var(--ink-2);font-size:14.5px;margin-top:4px}

/* ---------- COCINA ---------- */
.kds{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:14px 0 40px;align-items:start}
@media (max-width:900px){.kds{grid-template-columns:1fr}}
.col-h{display:flex;align-items:center;gap:8px;padding:0 2px 10px;position:sticky;top:47px;background:var(--bg);z-index:10}
.col-h .ct{font-family:var(--f-display);text-transform:uppercase;font-size:15px;letter-spacing:.06em}
.col-h .cc{font-variant-numeric:tabular-nums;font-weight:700;font-size:13px;color:var(--ink-3);background:var(--panel-3);border-radius:999px;padding:1px 9px}
.col-h .bar{height:3px;flex:1;border-radius:2px}
.kcards{display:flex;flex-direction:column;gap:10px}
.kcard{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--ink-3);border-radius:12px;padding:13px 14px}
.kcard.s-cola{border-left-color:var(--warn)}
.kcard.s-prep{border-left-color:var(--fuego)}
.kcard.s-listo{border-left-color:var(--ok)}
.kcard.nuevo{animation:pulse 1.1s ease 3}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(250,178,25,0)}50%{box-shadow:0 0 0 4px rgba(250,178,25,.22)}}
.kh{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.kh .kn{font-family:var(--f-display);font-size:27px;line-height:1}
.kh .kt{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;color:var(--ink-2);background:var(--panel-3);padding:2px 9px;border-radius:8px}
.kh .kt.w1{color:var(--warn)}
.kh .kt.w2{color:#fff;background:var(--bad)}
.kitems{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.kit{display:flex;gap:10px;align-items:flex-start}
.kit .kq{font-family:var(--f-display);font-size:19px;color:var(--brasa);min-width:30px;flex:none}
.kit .kb{min-width:0}
.kit .kb b{font-size:17px;font-weight:600;line-height:1.15;display:block}
.kit .kb span{font-size:14px;color:var(--fuego);display:block;line-height:1.25}
.kit .kb i{font-size:13.5px;color:var(--ink-3);font-style:normal;display:block}
.kit .kb .ksal{font-size:14.5px;color:var(--brasa);font-weight:600;display:block;line-height:1.3}
.kit .kb .knot{font-size:14px;color:#17130F;background:var(--brasa);border-radius:6px;padding:1px 7px;display:inline-block;margin-top:3px;font-weight:600}
.opt.opt-s[aria-pressed="true"]{border-color:var(--brasa);background:#3a2a10;color:var(--brasa)}
.opt.opt-no[aria-pressed="true"]{border-color:var(--bad);background:#2c1214;color:#ff9a9a}
.line .btn.sm{flex:none}
.knota{background:#3a2a10;color:var(--brasa);border-radius:8px;padding:6px 9px;font-size:13.5px;margin-bottom:10px}
.kacts{display:flex;gap:8px}
.kacts .btn{flex:1;padding:11px 10px}
.kfoot{display:flex;gap:8px;align-items:center;margin-top:9px;font-size:12px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 9px;border-radius:999px;border:1px solid var(--line-2);color:var(--ink-2)}
.pill .sw{width:9px;height:9px;border-radius:3px;flex:none}

/* ---------- ADMIN ---------- */
.tabs{display:flex;gap:6px;padding:14px 0 4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 15px;border-radius:10px;font-weight:600;color:var(--ink-2);white-space:nowrap;border:1px solid transparent}
.tab[aria-selected="true"]{background:var(--panel);border-color:var(--line-2);color:var(--ink)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:12px 0 4px}
select,input[type=text],input[type=date],input[type=number],input[type=password]{
  background:var(--panel-2);border:1px solid var(--line-2);border-radius:10px;padding:9px 11px;font-size:15px;min-width:0;
}
select:hover{border-color:var(--ink-3)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}
@media (max-width:880px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{padding:15px 16px 14px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line)}
.kpi.hero{background:linear-gradient(150deg,#33210c,var(--panel) 70%);border-color:#6a4a1c}
.kpi .kl{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.kpi .kv{font-family:var(--f-display);font-size:clamp(27px,4.4vw,37px);line-height:1.05;margin-top:5px;font-variant-numeric:tabular-nums}
.kpi.hero .kv{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.kpi .kf{font-size:12.5px;color:var(--ink-2);margin-top:3px}
.panel{padding:16px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);margin-top:14px}
.panel > h3{font-size:17px;margin-bottom:2px}
.panel > .ph{color:var(--ink-3);font-size:13px;margin-bottom:14px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.legend .li{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-2)}
.legend .sw{width:11px;height:11px;border-radius:3px}

/* columnas apiladas */
.chart{display:flex;gap:14px;align-items:stretch}
.yax{width:52px;flex:none;position:relative;height:230px;font-variant-numeric:tabular-nums}
.yax span{position:absolute;right:0;transform:translateY(-50%);font-size:11.5px;color:var(--ink-3)}
.plot{flex:1;height:230px;position:relative;display:flex;gap:min(3%,22px);align-items:flex-end;padding-bottom:0;min-width:0}
.gridline{position:absolute;left:0;right:0;height:1px;background:var(--line);pointer-events:none;z-index:0}
.gridline.base{background:var(--line-2)}
.colw{flex:1;max-width:168px;display:flex;flex-direction:column;justify-content:flex-end;height:100%;position:relative;min-width:0;z-index:1;
  background:none;border:0;padding:0;cursor:pointer;border-radius:6px;transition:opacity .15s}
.colw:hover .stack{filter:brightness(1.12)}

<!-- La librería va dentro del repo, igual que en equipo/: la página no
     depende de que un tercero esté disponible el día de la feria. -->
<script src="../lib/supabase-js-2.113.0.js"></script>
<script>
/* ==========================================================================
   POTENTE · OPERACIÓN EN FERIA
   Caja, cocina y el panel de ventas, sobre la misma base y la misma sesión
   que potente/equipo/.

   Quién ve qué lo decide la base, no esta página:
   · los montos viven en la tabla `ordenes`, que solo lee un admin (RLS);
   · cocina lee las vistas `cola_feria` y `cola_feria_items`, sin precios;
   · cobrar y mover la cola son funciones (`crear_orden`, `marcar_estado`),
     así nadie necesita permiso de escritura sobre la tabla.
   Esconder el botón de Ventas es comodidad: aunque alguien lo forzara,
   la base no le devolvería un solo sol.
   ========================================================================== */

const SUPABASE_URL = 'https://iuvovrupvficgwwyszoy.supabase.co'
const SUPABASE_KEY = 'sb_publishable_J9q-R_siYfRvDWz7b1P_ZQ_g_IPMtLX'

if (!window.supabase || !window.supabase.createClient) {
  document.getElementById("view").innerHTML =
    '<div class="wrap"><div class="empty" style="padding-top:70px"><div class="big">No cargó la base de datos</div>' +
    "<p>Recarga la página. Si sigue igual, avisa a administración.</p></div></div>";
  throw new Error("supabase-js no disponible");
}
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const PAGO_BD = { qr:"qr", qrpos:"qrpos", tarjeta:"tarjeta", efectivo:"efectivo" };

/* ---------- estado ---------- */
const S = {
  listo:false, yo:null, turnos:[],
  role:null,                 // "caja" | "cocina" | "admin"
  ferias:[], productos:[],
  feriaOp:null,              // feria en curso donde cobra este equipo
  ordenes:[],                // cola de la feria en curso (sin montos)
  feriaSel:null, ordSel:[],  // lo que mira el administrador (con montos)
  cart:[], cat:"Todo", cartOpen:false,
  adminVista:"ferias", adminSub:"resumen", diaSel:"todos", matrizModo:"unid",
  sonido:lsGet("pot_sonido", true),
  vistos:{}, sheet:null, avance:null
};
const esAdmin = () => !!(S.yo && S.yo.rol === "admin");

/* ---------- mapeos entre la base y la app ---------- */
function mapProducto(p){
  return { sku:p.sku, nombre:p.nombre, cat:p.categoria, desc:p.descripcion || "",
           precio:+p.precio, salsas:!!p.lleva_salsas, activo:p.activo !== false,
           opciones:(p.opciones && p.opciones.length) ? p.opciones : null, pos:p.posicion || 0 };
}
function mapFeria(f){
  return { id:f.id, nombre:f.nombre, lugar:f.lugar || "", inicio:f.fecha_inicio, fin:f.fecha_fin,
           estadoWeb:f.estado, punto0:+f.punto0 || 0,
           bonoPct:f.bono_pct == null ? 50 : +f.bono_pct,
           mostrarEquipo:f.mostrar_equipo !== false };
}
function mapOrden(o, items){
  const ts = o.creado_en;
  return { id:o.id, num:o.numero, ts, dia:o.dia, hora:hhDe(new Date(ts)),
           items:items || [], total:o.total == null ? null : +o.total,
           pago:o.medio_pago, estado:o.estado, nota:o.nota || "",
           cajero_id:o.cajero_id, cocinero_id:o.cocinero_id,
           tsPrep:o.iniciada_en, tsListo:o.lista_en, tsEntregado:o.entregada_en };
}
function mapItem(i){
  return { sku:i.sku, nombre:i.nombre, cat:i.categoria, qty:i.cantidad,
           precio:i.precio == null ? null : +i.precio,
           subtotal:i.subtotal == null ? null : +i.subtotal,
           opts:i.opciones || {}, salsas:i.salsas || [], nota:i.nota || "",
           detalle:detalleDesde(i.sku, i.opciones || {}) };
}
function detalleDesde(sku, opts){
  const p = CARTA.find(x => x.sku === sku);
  if (!p || !p.opciones) return "";
  return p.opciones.map(o => opts[o.id]).filter(Boolean).join(" · ");
}

/* ---------- el estado de la feria sale de sus fechas ---------- */
const ESTADO_FERIA = { activa:"En curso", programada:"Programada", terminada:"Terminada" };
function estadoFeria(f){
  if (!f) return "terminada";
  const hoy = diaDe(new Date());
  if (f.fin && hoy > f.fin) return "terminada";
  if (f.inicio && hoy < f.inicio) return "programada";
  return "activa";
}
const feriasPorEstado = e => S.ferias.filter(f => estadoFeria(f) === e);
const feriaEnCurso = () => S.ferias.find(f => f.id === S.feriaOp) || null;

function ajustarFeriaOp(){
  // La feria en la que puedes operar es la de TU turno de hoy, y ninguna otra.
  // El administrador es la excepción: entra a cualquiera que esté en curso,
  // porque es quien resuelve los problemas del día.
  const curso = feriasPorEstado("activa").slice().sort((a, b) =>
    (a.inicio || "") === (b.inicio || "") ? 0 : ((a.inicio || "") < (b.inicio || "") ? 1 : -1));
  const delTurno = S.turnos.map(t => t.feria_id).find(id => curso.some(f => f.id === id));
  const id = delTurno || (esAdmin() && curso.length ? curso[0].id : null);
  if (id !== S.feriaOp){ S.feriaOp = id; return true; }
  return false;
}
/* El permiso para cobrar y para cocinar es el mismo: estar asignado hoy a esta
   feria. No separa por rol a propósito — el equipo rota entre caja y cocina. */
function miTurno(){ return S.turnos.find(t => t.feria_id === S.feriaOp) || null; }
/* Un turno armado pero sin publicar no habilita nada: la base lo rechaza igual.
   Se distingue del "no te toca" para que el equipo sepa a quién reclamar. */
function turnoSinPublicar(){ const t = miTurno(); return !!t && t.publicado === false; }
function puedoOperar(){ const t = miTurno(); return esAdmin() || (!!t && t.publicado !== false); }
function bloqueDeAhora(){
  const f = feriaEnCurso(); if (!f) return null;
  const t = S.turnos.find(x => x.feria_id === f.id);
  return t ? t.bloque_id : null;
}

/* ==========================================================================
   ARRANQUE
   ========================================================================== */
async function boot(){
  render();
  const { data:{ session } } = await sb.auth.getSession();
  if (!session){ location.replace("../?volver=feria"); return; }
  const { data:{ user } } = await sb.auth.getUser();
  const { data:perfil, error } = await sb.from("perfiles").select("*").eq("id", user.id).single();
  if (error || !perfil){ avisoDuro("Tu cuenta no tiene perfil. Avisa al administrador."); return; }
  if (!perfil.activo){ avisoDuro("Tu cuenta está desactivada. Habla con el administrador."); return; }
  S.yo = perfil;

  try { await cargarBase(); } catch(e){ console.error(e); avisoDuro("No se pudieron cargar los datos."); return; }
  S.listo = true;

  // El turno de hoy abre la pantalla más probable; quien está asignado puede
  // cambiarse a la otra cuando quiera (en el stand se rota).
  const t = miTurno();
  if (t && (t.rol === "caja" || t.rol === "cocina")) S.role = t.rol;
  else if (!esAdmin()) S.role = null;
  if (S.role === "cocina") S.ordenes.forEach(o => S.vistos[o.id] = 1);

  // Si llegó desde "Ventas y objetivos" de una feria concreta, abre esa misma
  // y no la lista: el administrador ya dijo cuál quiere ver.
  const pedida = new URLSearchParams(location.search).get("feria");
  if (pedida && esAdmin() && S.ferias.some(f => f.id === pedida)){
    S.role = "admin"; S.feriaSel = pedida;
    S.adminVista = "feria"; S.adminSub = "resumen"; S.diaSel = "todos";
    refrescarAdmin();
  }

  render();
  setInterval(() => { if (S.role === "caja" || S.role === "cocina") refrescarCola(); }, 5000);
  setInterval(() => { if (S.role === "admin" && S.adminVista === "feria") refrescarAdmin(); }, 20000);
  setInterval(() => { if (ajustarFeriaOp()) { refrescarCola(); render(true); } }, 60000);
}
function avisoDuro(txt){
  $("#view").innerHTML = '<div class="wrap"><div class="empty" style="padding-top:70px">' +
    '<div class="big">No se puede entrar</div><p>' + esc(txt) + "</p>" +
    '<a class="btn" href="../" style="margin-top:16px">Volver a Equipo</a></div></div>';
}

async function cargarBase(){
  const [prod, fer, turno] = await Promise.all([
    sb.from("productos").select("*").order("posicion"),
    sb.from("ferias").select("*").neq("estado", "borrador").order("fecha_inicio", { ascending:false }),
    sb.rpc("mi_turno_hoy")
  ]);
  if (prod.error) throw prod.error;
  S.productos = prod.data.map(mapProducto);
  CARTA = S.productos.slice().sort((a, b) => a.pos - b.pos);
  CATS = [];
  CARTA.forEach(p => { if (CATS.indexOf(p.cat) < 0) CATS.push(p.cat); });

  S.ferias = (fer.data || []).map(mapFeria);
  S.turnos = turno.error ? [] : (turno.data || []);
  ajustarFeriaOp();
  if (!S.feriaSel) S.feriaSel = S.feriaOp || (S.ferias[0] && S.ferias[0].id) || null;
  await refrescarCola();
}

/* La cola que ven caja y cocina: por las vistas, sin un solo monto. */
async function refrescarCola(){
  const id = S.feriaOp;
  if (!id){ S.ordenes = []; return; }
  const hoy = diaDe(new Date());
  const { data, error } = await sb.from("cola_feria")
    .select("*").eq("feria_id", id).eq("dia", hoy).order("numero");
  if (error){ console.warn("[potente] cola", error.message); return; }
  const ids = data.map(o => o.id);
  let items = [];
  if (ids.length){
    const r = await sb.from("cola_feria_items").select("*").in("orden_id", ids);
    items = r.data || [];
  }
  const porOrden = {};
  items.forEach(i => (porOrden[i.orden_id] || (porOrden[i.orden_id] = [])).push(mapItem(i)));
  const antes = JSON.stringify(S.ordenes.map(o => [o.id, o.estado]));
  S.ordenes = data.map(o => mapOrden(o, porOrden[o.id] || []));
  if (S.role === "cocina") avisarNuevas();
  await refrescarAvance();
  if (JSON.stringify(S.ordenes.map(o => [o.id, o.estado])) !== antes) render(true);
}

/* Porcentaje hacia el bono. La base devuelve el número ya calculado:
   el equipo nunca recibe montos, ni aunque mire la respuesta de la red. */
async function refrescarAvance(){
  const f = feriaEnCurso();
  if (!f || !f.mostrarEquipo || !f.punto0){ S.avance = null; return; }

/* Lo que mira el administrador: la tabla real, con montos. */
async function refrescarAdmin(){
  const id = S.feriaSel;
  if (!id || !esAdmin()){ S.ordSel = []; return; }
  const { data, error } = await sb.from("ordenes").select("*").eq("feria_id", id).order("numero");
  if (error){ console.warn("[potente] ordenes", error.message); return; }
  const ids = data.map(o => o.id);
  let items = [];
  for (let i = 0; i < ids.length; i += 200){
    const r = await sb.from("orden_items").select("*").in("orden_id", ids.slice(i, i + 200));
    items = items.concat(r.data || []);
  }
  const porOrden = {};
  items.forEach(i => (porOrden[i.orden_id] || (porOrden[i.orden_id] = [])).push(mapItem(i)));
  S.ordSel = data.map(o => mapOrden(o, porOrden[o.id] || []));
  render(true);
}

   así un refresco de fondo no puede borrárselo a media edición. */
function draftP0(f){
  if (!S.p0Draft || S.p0Draft.id !== f.id)
    S.p0Draft = { id:f.id,
      punto0: f.punto0 ? String(f.punto0) : "",
      bonoPct: String(f.bonoPct == null ? 50 : f.bonoPct),
      ver: f.mostrarEquipo !== false };
  return S.p0Draft;
}
async function guardarPunto0(){
  const f = S.ferias.find(x => x.id === S.feriaSel);
  if (!f) return;
  const d = draftP0(f);
  const txt = String(($("#p0") ? $("#p0").value : d.punto0) || "").trim();
  if (txt === ""){
    toast("Escribe cuánto te cuesta poner esta feria en pie, y después guarda.");
    if ($("#p0")) $("#p0").focus();
    return;
  }
  const v = Math.max(0, +txt || 0);
  const bp = Math.max(0, +(($("#p0bono") ? $("#p0bono").value : d.bonoPct) || 50));
  const ver = $("#p0Ver") ? $("#p0Ver").getAttribute("aria-pressed") === "true" : d.ver;
  const { error } = await sb.from("ferias")
    .update({ punto0:v, bono_pct:bp, mostrar_equipo:ver }).eq("id", f.id);
  if (error){ toast("No se pudo guardar: " + error.message); return; }
  f.punto0 = v; f.bonoPct = bp; f.mostrarEquipo = ver;
  S.p0Draft = null;
  toast(v ? "Punto 0 guardado: " + soles(v) + " · bono al superar " + soles(v * (1 + bp / 100)) : "Punto 0 borrado.");
  render();
}

async function entregar(filename, data){
  try {
    const blob = data instanceof Blob ? data : new Blob([data], { type:"application/octet-stream" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  } catch(e){ console.warn("[potente] descarga", e); toast("No se pudo generar el archivo."); }
}

/* ---------- arranque ---------- */

/* ¿En qué feria cobra ESTE equipo?
   1) la que le asignó el administrador, si sigue en curso;
   2) si solo hay una en curso, esa, sin preguntar nada;
   3) si hay varias y nadie asignó, la que empezó más recientemente. */
/* ---------- escrituras ---------- */
// Red de seguridad: si aun así dos órdenes quedaran con el mismo número,
// la que se creó después se renumera sola. La primera no se toca.
/* ---------- carrito ---------- */
function precioDe(sku){ const p = CARTA.find(x => x.sku === sku); return p ? p.precio : 0; }
function activo(sku){ const p = CARTA.find(x => x.sku === sku); return !p || p.activo !== false; }
function detalleOpts(l){
  const p = CARTA.find(x => x.sku === l.sku);
  if (!p || !p.opciones) return "";
  return p.opciones.map(o => l.opts[o.id]).filter(Boolean).join(" · ");
}
const salsasTxt = l => (l.salsas && l.salsas.length) ? l.salsas.join(", ") : "";
function resumenLinea(l){
  return [detalleOpts(l), salsasTxt(l), l.nota].filter(Boolean).join(" · ");
}
function claveLinea(sku, opts, salsas, nota){
  return sku + "|" + JSON.stringify(opts || {}) + "|" + (salsas || []).join(",") + "|" + (nota || "");
}
function agregar(sku, opts, salsas, nota, qty, editKey){
  const p = CARTA.find(x => x.sku === sku);
  qty = Math.max(1, qty || 1);
  if (editKey) S.cart = S.cart.filter(l => l.key !== editKey);
  const k = claveLinea(sku, opts, salsas, nota);
  const ex = S.cart.find(l => l.key === k);
  if (ex) ex.qty += qty;
  else S.cart.push({ key:k, sku, nombre:p.nombre, cat:p.cat, precio:precioDe(sku), qty,
                     opts:opts || {}, salsas:salsas || [], nota:nota || "" });
  beep(660, .05);
  render();
}
function cambiarQty(key, d){

let AC = null;
function beep(freq, dur){
  if (!S.sonido) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === "suspended") AC.resume();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = "triangle"; o.frequency.value = freq;
    g.gain.setValueAtTime(.0001, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(.16, AC.currentTime + .01);
    g.gain.exponentialRampToValueAtTime(.0001, AC.currentTime + (dur || .12));
    o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + (dur || .12) + .02);
  } catch(e){}
}
function avisarNuevas(){

  S.ordenes.forEach(o => { if (o.estado === "cola" && !S.vistos[o.id]){ S.vistos[o.id] = Date.now(); hay = true; } });
  if (hay && Object.keys(S.vistos).length > S.ordenes.filter(o => o.estado === "cola").length - 1){
    beep(880, .13); setTimeout(() => beep(1180, .16), 150);

}

}

/* ==========================  ANALÍTICA  ========================== */
function analitica(ordenes, dia){
  const vivas = ordenes.filter(o => o.estado !== "anulado");
  const sel = vivas.filter(o => dia === "todos" || o.dia === dia);
  const vacio = () => Object.fromEntries(PAGOS.map(p => [p.id, 0]));

  const dias = {};
  vivas.forEach(o => {
    const d = dias[o.dia] || (dias[o.dia] = { dia:o.dia, total:0, n:0, pagos:vacio() });
    d.total += o.total; d.n++; d.pagos[o.pago] = (d.pagos[o.pago] || 0) + o.total;
  });
  const porDia = Object.values(dias).sort((a, b) => a.dia < b.dia ? -1 : 1);

  // matriz producto × día, siempre sobre la feria completa
  const pd = {};
  vivas.forEach(o => o.items.forEach(i => {
    const f = pd[i.sku] || (pd[i.sku] = { sku:i.sku, nombre:i.nombre, cat:i.cat, unid:0, monto:0, dias:{} });
    const c = f.dias[o.dia] || (f.dias[o.dia] = { unid:0, monto:0 });
    c.unid += i.qty; c.monto += i.subtotal; f.unid += i.qty; f.monto += i.subtotal;
  }));
  const porProductoDia = Object.values(pd).sort((a, b) => b.unid - a.unid);

  const pagos = vacio(), pagosN = vacio();
  const prod = {}, horas = {}, prodUnid = {};
  sel.forEach(o => {
    pagos[o.pago] = (pagos[o.pago] || 0) + o.total;
    pagosN[o.pago] = (pagosN[o.pago] || 0) + 1;
    horas[o.hora != null ? o.hora : hhDe(new Date(o.ts))] = (horas[o.hora != null ? o.hora : hhDe(new Date(o.ts))] || 0) + o.total;
    o.items.forEach(i => {
      const p = prod[i.sku] || (prod[i.sku] = { sku:i.sku, nombre:i.nombre, cat:i.cat, unid:0, monto:0, pagos:vacio() });
      p.unid += i.qty; p.monto += i.subtotal; p.pagos[o.pago] += i.subtotal;
      // unidades que cocina realmente prepara (los combos se abren)
      const base = CARTA.find(x => x.sku === i.sku);
      if (base && base.produce){
        base.produce.forEach(pz => {
          const nom = pz.k.indexOf("opt:") === 0 ? (i.opts[pz.k.slice(4)] || pz.n) : (CARTA.find(x => x.sku === pz.k) || {}).nombre || pz.n;
          prodUnid[nom] = (prodUnid[nom] || 0) + i.qty;
        });
      } else {
        const nom = i.nombre + (i.sku === "pancho" && i.opts.tipo ? " " + i.opts.tipo : "");
        prodUnid[nom] = (prodUnid[nom] || 0) + i.qty;
      }
    });
  });
  const porProducto = Object.values(prod).sort((a, b) => b.monto - a.monto);
  const total = sel.reduce((s, o) => s + o.total, 0);
  const unidades = Object.values(prodUnid).reduce((s, q) => s + q, 0);
  return {
    sel, total, n:sel.length, ticket: sel.length ? total / sel.length : 0,
    pagos, pagosN, porDia, porProducto, porProductoDia, horas,
    produccion: Object.entries(prodUnid).sort((a, b) => b[1] - a[1]),
    unidades,
    anuladas: ordenes.filter(o => o.estado === "anulado" && (dia === "todos" || o.dia === dia)).length,
    pendientes: sel.filter(o => o.estado !== "entregado").length
  };
}

/* ---------- tiempos de cocina ---------- */
const META_MIN = 10;
function mmss(seg){
  if (seg == null || !isFinite(seg)) return "—";
  const m = Math.floor(seg / 60), x = Math.round(seg % 60);
  return m + ":" + String(x).padStart(2, "0");
}
const prom = xs => xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : null;
function mediana(xs){
  if (!xs.length) return null;
  const o = xs.slice().sort((a, b) => a - b), m = Math.floor(o.length / 2);
  return o.length % 2 ? o[m] : (o[m - 1] + o[m]) / 2;
}
function tiempos(ordenes, dia){
  const base = ordenes.filter(o => o.estado !== "anulado" && (dia === "todos" || o.dia === dia));
  const seg = (a, b) => (a && b) ? (new Date(b).getTime() - new Date(a).getTime()) / 1000 : null;
  const filas = base.map(o => ({
    o,
    cola: seg(o.ts, o.tsPrep),
    prep: seg(o.tsPrep, o.tsListo),
    entrega: seg(o.tsListo, o.tsEntregado),
    total: seg(o.ts, o.tsEntregado || o.tsListo)
  })).filter(r => r.total != null && r.total >= 0);
  const tot = filas.map(r => r.total);
  return {
    filas, medidos:filas.length, cobrados:base.length,
    promTotal:prom(tot), medTotal:mediana(tot),
    promCola:prom(filas.map(r => r.cola).filter(x => x != null)),
    promPrep:prom(filas.map(r => r.prep).filter(x => x != null)),
    promEntrega:prom(filas.map(r => r.entrega).filter(x => x != null)),
    peor:filas.slice().sort((a, b) => b.total - a.total)[0],
    enMeta:filas.filter(r => r.total <= META_MIN * 60).length,
    porHora:(() => {
      const h = {};
      filas.forEach(r => { const k = r.o.hora != null ? r.o.hora : hhDe(new Date(r.o.ts));
        (h[k] || (h[k] = [])).push(r.total); });
      return Object.fromEntries(Object.entries(h).map(([k, v]) => [k, prom(v)]));
    })(),
    lentos:filas.slice().sort((a, b) => b.total - a.total).slice(0, 10)
  };
}

      '<span class="tot">' + solesK(x.total) + "</span>" +

  const yl = [0, .5, 1].map(f =>
    "<span style=\"bottom:" + Math.round(f * H) + 'px">' + solesK(esc0.max * f) + "</span>").join("");
  const totFeria = d.reduce((t, x) => t + x.total, 0), ordFeria = d.reduce((t, x) => t + x.n, 0);
  return '<div class="panel"><h3>Venta por día</h3>' +

        '<span class="lbl" style="display:block">Toda la feria · ' + d.length + (d.length === 1 ? " día" : " días") + "</span>" +
        '<b class="num">' + soles(totFeria) + "</b>" +
        '<span style="color:var(--ink-2);font-size:13px"> · ' + ordFeria + " órdenes</span></button>" +
      '<div class="ph" style="margin:0;flex:1;min-width:230px;text-align:right">Toca una columna para ver ese día solo, o <b>Toda la feria</b> para volver al acumulado.</div>' +
    "</div>" +
    '<div class="chart"><div class="yax">' + yl + '</div><div class="plot">' + gl + cols + "</div></div>" +
    '<div class="xax">' + d.map(x => '<button data-dia="' + (S.diaSel === x.dia ? "todos" : x.dia) + '"><b>' + diaLargo(x.dia) + "</b>" + x.n + " órd.</button>").join("") + "</div></div>";
}
function escalaBonita(max){
  if (!max) return { max:100 };
  const p = Math.pow(10, Math.floor(Math.log10(max)));
  const m = [1, 1.25, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10].map(k => k * p).find(v => v >= max * 1.02) || max * 1.1;
  return { max:m };
}

function panelPunto0(a){
  const f = feriaSel();
  if (!f) return "";
  const meta = +f.punto0 || 0;
  const bonoPct = f.bonoPct == null ? 50 : +f.bonoPct;
  const bono = meta * (1 + bonoPct / 100);
  const dP0 = draftP0(f);
  const vendido = a.porDia.reduce((t, d) => t + d.total, 0);
  const ordenes = a.porDia.reduce((t, d) => t + d.n, 0);
  const editor = '<div class="p0-edit">' +
    '<label><span class="lbl" style="display:block;margin-bottom:5px">Punto 0 de esta feria (S/)</span>' +
    '<input id="p0" type="number" min="0" step="10" value="' + esc(dP0.punto0) + '" placeholder="0.00"></label>' +
    '<label><span class="lbl" style="display:block;margin-bottom:5px">Bono del equipo al superar</span>' +
    '<input id="p0bono" type="number" min="0" step="5" value="' + esc(dP0.bonoPct) + '" placeholder="50"></label>' +
    '<span class="lbl" style="align-self:end;padding-bottom:11px">% sobre el punto 0</span>' +
    '<button class="toggle" id="p0Ver" aria-pressed="' + dP0.ver + '" style="align-self:end;padding:10px 13px">' +
      (dP0.ver ? "El equipo ve su avance" : "Oculto para el equipo") + "</button>" +
    '<button class="btn sm" id="p0Guardar" style="align-self:end">Guardar</button></div>';

  const estado = !meta ? "sin" : vendido >= bono ? "bono" : vendido >= meta ? "cubierto" : "rojo";
  const ticket = ordenes ? vendido / ordenes : 0;
  const pedidos = falta => { if (!ticket) return ""; const n = Math.ceil(falta / ticket);
    return " · " + (n === 1 ? "un <b>1</b> pedido más" : "unos <b>" + n + "</b> pedidos más") + " al ticket promedio"; };
  const cabeza = {
    sin:      { pill:"○ Sin meta",         num:vendido,          txt:"vendido en la feria. Escribe abajo cuánto te cuesta ponerla en pie — insumos, personal, transporte, el puesto — y esta tarjeta te dirá en vivo si ya lo cubriste y a cuánto está el equipo del bono." },
    rojo:     { pill:"▼ En rojo",          num:meta - vendido,   txt:(vendido ? "te faltan para llegar al punto 0 de <b>" + soles(meta) + "</b>" : "es el punto 0 de esta feria · todavía no hay ventas registradas") + pedidos(meta - vendido) },
    cubierto: { pill:"✔ Costos cubiertos", num:vendido - meta,   txt:"sobre el punto 0 · faltan <b>" + soles(bono - vendido) + "</b> para el bono del equipo" + pedidos(bono - vendido) },
    bono:     { pill:"★ Bono alcanzado",   num:vendido - bono,   txt:"por encima del punto de bono — el equipo se lo ganó" }
  }[estado];

  // El punto 0 se dibuja SIEMPRE en el mismo lugar de la barra (ANCLA %): es fijo, es lo que
  // cuesta la feria. Cambiar el % del bono, o vender más, mueve el tramo de la derecha, nunca el punto 0.
  const ANCLA = 58;
  const derecha = Math.max(bono, vendido, meta * 1.15);
  const pos = v => {
    if (!meta) return 0;
    if (v <= meta) return v / meta * ANCLA;
    const span = derecha - meta;
    return Math.min(100, ANCLA + (span > 0 ? (v - meta) / span * (100 - ANCLA) * 0.94 : 0));
  };
  const marca = (v, lab, cls) => '<span class="p0-mark' + cls + '" style="left:' + pos(v) + '%" data-lab="' +
    esc(lab) + '" data-val="' + esc(soles(v)) + '"></span>';

  return '<div class="panel p0 ' + estado + '"><h3>Punto 0 y bono</h3>' +
    '<div class="ph">Sobre <b>toda la feria</b>, no sobre el día que estés viendo: los costos son de la feria completa.</div>' +
    '<div class="p0-head">' +
      '<span class="p0-estado">' + cabeza.pill + "</span>" +
      '<span class="p0-num num">' + soles(Math.abs(cabeza.num)) + "</span>" +
      '<span class="p0-txt">' + cabeza.txt + "</span>" +
    "</div>" +
    '<div class="p0-bar"><div class="p0-fill" style="width:' + (meta ? pos(vendido) : 0) + '%"></div>' +
      (meta ? marca(meta, "punto 0", "") + marca(bono, "bono", " bono") : "") + "</div>" +
    '<div class="p0-foot">' +
      '<span>Vendido <b class="num">' + soles(vendido) + "</b></span>" +
      '<span>Punto 0 <b class="num">' + (meta ? soles(meta) : "—") + "</b></span>" +
      '<span>Punto de bono <b class="num">' + (meta ? soles(bono) : "—") + "</b> <span class=\"mut\">(+" + bonoPct + "%)</span></span>" +
      '<span>' + ordenes + " órdenes · ticket " + soles(ticket) + "</span>" +
    "</div>" + editor + "</div>";
}

  const panelHora = '<div class="panel"><h3>Tiempo de entrega por hora</h3>' +

    '<div class="hours">' + hs.map(h => {
      const v = t.porHora[h];
      return '<div class="hcol" data-tip="' + esc(h + ":00 – " + (h + 1) + ":00||Promedio:" + mmss(v)) + '">' +
        '<div class="hbar" style="height:' + Math.max(v ? 3 : 0, Math.round((v || 0) / maxH * 96)) + "px;background:" +
        (v > META_MIN * 60 ? "var(--bad)" : "var(--fuego)") + '"></div><div class="hlab">' + h + "</div></div>";
    }).join("") + "</div>" +
    '<div class="lbl" style="margin-top:10px">Eje: minutos promedio · máximo ' + mmss(maxH) + "</div></div>";

  const panelLentos = '<div class="panel"><h3>Los pedidos que más tardaron</h3>' +
    '<div class="ph">Para mirar qué tenían adentro y a qué hora entraron. Ahí suele estar la explicación.</div>' +
    '<div class="tblwrap"><table><thead><tr><th>Pedido</th><th>Hora</th><th>En cola</th><th>Preparación</th><th>Entrega</th><th>Total</th><th>Contenido</th></tr></thead><tbody>' +
    t.lentos.map(r => "<tr><td>#" + r.o.num + '</td><td class="n">' + horaDe(new Date(r.o.ts)) + "</td>" +
      '<td class="n">' + mmss(r.cola) + '</td><td class="n">' + mmss(r.prep) + '</td><td class="n">' + mmss(r.entrega) + "</td>" +
      '<td class="n"><b style="color:' + (r.total > META_MIN * 60 ? "var(--bad)" : "var(--ink)") + '">' + mmss(r.total) + "</b></td>" +
      '<td style="white-space:normal;text-align:left;color:var(--ink-2)">' + esc(r.o.items.map(i => i.qty + "× " + i.nombre).join(", ")) + "</td></tr>").join("") +
    "</tbody></table></div></div>";

  const aviso = t.medidos < t.cobrados
    ? '<div class="panel" style="border-color:#5a4318;background:#241a0d"><div class="ph" style="margin:0">' +
      "Se midieron " + t.medidos + " de " + t.cobrados + " pedidos de " + esc(etq) +
      ". Los que faltan no llegaron a marcarse como entregados en cocina.</div></div>"
    : "";

  return barraDia() + kpis + panelEtapas + panelTiemposDia() + panelHora + panelLentos + aviso;
}

function panelTiemposDia(){
  const todos = tiempos(S.ordSel, "todos");
  if (!todos.medidos) return "";
  const dias = Array.from(new Set(todos.filas.map(r => r.o.dia))).sort();
  const fila = (etq, fs, activo) => {
    const t = x => prom(fs.map(r => r[x]).filter(v => v != null));
    const tot = fs.map(r => r.total);
    const meta = fs.filter(r => r.total <= META_MIN * 60).length;
    return "<tr" + (activo ? ' style="background:rgba(247,134,27,.07)"' : "") + "><td>" + esc(etq) + "</td>" +
      '<td class="n">' + fs.length + "</td>" +
      '<td class="n">' + mmss(t("cola")) + '</td><td class="n">' + mmss(t("prep")) + '</td><td class="n">' + mmss(t("entrega")) + "</td>" +
      '<td class="n"><b>' + mmss(prom(tot)) + "</b></td>" +
      '<td class="n">' + mmss(mediana(tot)) + "</td>" +
      '<td class="n"><b style="color:' + (meta / fs.length >= .8 ? "var(--ok)" : meta / fs.length >= .5 ? "var(--brasa)" : "var(--bad)") + '">' +
        Math.round(meta / fs.length * 100) + "%</b></td></tr>";
  };
  const filas = dias.map(d => fila(diaLargo(d), todos.filas.filter(r => r.o.dia === d), S.diaSel === d)).join("") +
    '<tr class="tot">' + fila("Toda la feria", todos.filas, S.diaSel === "todos").slice(4);
  return '<div class="panel"><h3>Tiempos día por día</h3>' +
    '<div class="ph">La misma medición de arriba, abierta por día y con el acumulado de la feria al final. ' +
    "Sirve para ver si el sábado pico se les fue de las manos respecto al viernes.</div>" +
    '<div class="tblwrap"><table><thead><tr><th>Día</th><th>Pedidos</th><th>En cola</th><th>Preparación</th><th>Entrega</th><th>Total prom.</th><th>Mediana</th><th>Dentro de ' + META_MIN + ' min</th></tr></thead><tbody>' +
    filas + "</tbody></table></div></div>";
}

function diasHasta(iso){
  const hoy = new Date(diaDe(new Date()) + "T12:00:00Z"), d = new Date(iso + "T12:00:00Z");
  return Math.round((d - hoy) / 86400000);
}

  console.error("[potente]", err); toast("Algo falló al tocar ese botón. Vuelve a intentarlo."); }); });
async function manejarClick(ev){
  const t = ev.target.closest("[data-rol],[data-cat],[data-add],[data-q],[data-opt],[data-salsa],[data-qs],[data-editar],[data-pay],[data-est],[data-tab],[data-bajar],[data-matriz],[data-anular],[data-dia],[data-sub],[data-volver],[data-verferia],[data-precio],[data-activo],[data-cerrar-sheet],[data-bg],button");
  if (!t) return;
  const g = a => t.getAttribute(a);

  if (g("data-bg") && ev.target === t) return cerrarSheet();
  if (t.hasAttribute("data-cerrar-sheet")) return cerrarSheet();

  if (t.hasAttribute("data-rol")){
    const r = g("data-rol");
    if (r === "admin" && !esAdmin()) return;
    if ((r === "caja" || r === "cocina") && !puedoOperar()) return;
    S.role = r || null; S.cart = []; S.cartOpen = false;
    if (r === "admin") refrescarAdmin();
    if (r === "cocina") S.ordenes.forEach(o => S.vistos[o.id] = 1);
    return render();
  }
  if (t.id === "chipRole") { S.role = null; S.sheet = null; return render(); }
  if (t.id === "btnSalir"){ await sb.auth.signOut(); location.replace("../"); return; }

  /* --- caja --- */
  if (t.hasAttribute("data-cat")){ S.cat = g("data-cat"); return render(); }
  if (t.hasAttribute("data-add")){
    S.sheet = { t:"opts", sku:g("data-add"), opts:{}, salsas:[], nota:"", qty:1 };
    return pintarModal();
  }
  if (t.hasAttribute("data-editar")){
    const l = S.cart.find(x => x.key === g("data-editar")); if (!l) return;
    S.sheet = { t:"opts", sku:l.sku, opts:Object.assign({}, l.opts), salsas:(l.salsas || []).slice(),
                nota:l.nota || "", qty:l.qty, editKey:l.key };
    return pintarModal();
  }
  if (t.hasAttribute("data-q")){ const [k, d] = g("data-q").split("|"); return cambiarQty(k, +d); }
  if (t.id === "toggleCart"){ S.cartOpen = !S.cartOpen; return render(); }
  if (t.id === "vaciar"){ S.cart = []; S.cartOpen = false; return render(); }
  if (t.id === "cobrar"){ S.sheet = { t:"cobro", pago:null, nota:"" }; return pintarModal(); }
  if (t.hasAttribute("data-opt")){
    const [id, val] = g("data-opt").split("|");
    S.sheet.opts[id] = val; return pintarModal();
  }
  if (t.hasAttribute("data-salsa")){
    const v = g("data-salsa"), sel = S.sheet.salsas || [];
    if (v === SIN_SALSA) S.sheet.salsas = sel.indexOf(SIN_SALSA) >= 0 ? [] : [SIN_SALSA];
    else {
      const sin = sel.filter(x => x !== SIN_SALSA);
      S.sheet.salsas = sin.indexOf(v) >= 0 ? sin.filter(x => x !== v) : sin.concat([v]);
    }
    return pintarModal();
  }
  if (t.hasAttribute("data-qs")){
    S.sheet.qty = Math.max(1, (S.sheet.qty || 1) + (+g("data-qs")));
    return pintarModal();
  }
  if (t.id === "optAdd"){
    const sh = S.sheet;
    const nota = ($("#notaLinea") && $("#notaLinea").value.trim()) || sh.nota || "";
    S.sheet = null;
    agregar(sh.sku, sh.opts, sh.salsas, nota, sh.qty || 1, sh.editKey);
    return;
  }
  if (t.hasAttribute("data-pay")){ S.sheet.pago = g("data-pay"); return pintarModal(); }
  if (t.id === "confirmar"){
    const s = S.sheet; if (!s.pago || s.enviando) return;
    s.enviando = true; pintarModal();
    const total = totalCarrito();
    try {
      const num = await registrarOrden(s.pago, ($("#nota") && $("#nota").value) || s.nota);
      S.cart = []; S.cartOpen = false;
      S.sheet = { t:"ticket", num, total, pago:s.pago };
      beep(760, .1); setTimeout(() => beep(1020, .12), 110);
      render();
      setTimeout(() => { if (S.sheet && S.sheet.t === "ticket" && S.sheet.num === num) cerrarSheet(); }, 5000);
    } catch(e){
      s.enviando = false; pintarModal();
      toast("No se pudo registrar el pedido. Revisa la conexión e inténtalo otra vez.");
      console.error(e);
    }
    return;
  }

  /* --- cocina --- */
  if (t.hasAttribute("data-est")){
    const [id, est] = g("data-est").split("|");
    const o = S.ordenes.find(x => x.id === id); if (o){ o.estado = est; render(); await cambiarEstado(o, est); }
    return;
  }
  if (t.id === "sonido"){ S.sonido = !S.sonido; lsSet("pot_sonido", S.sonido); if (S.sonido) beep(880, .1); return render(); }

  /* --- admin --- */
  if (t.hasAttribute("data-tab")){ S.adminVista = g("data-tab"); return render(); }
  if (t.hasAttribute("data-sub")){ S.adminSub = g("data-sub"); return render(); }
  if (t.hasAttribute("data-volver")){ S.adminVista = "ferias"; return render(); }
  if (t.hasAttribute("data-verferia")){
    S.feriaSel = g("data-verferia"); S.diaSel = "todos"; S.adminVista = "feria"; S.adminSub = "resumen";
    S.ordSel = []; render(); return refrescarAdmin();
  }
  if (t.hasAttribute("data-dia")){ S.diaSel = g("data-dia"); return render(); }
  if (t.hasAttribute("data-matriz")){ S.matrizModo = g("data-matriz"); return render(); }
  if (t.id === "csv"){ S.sheet = { t:"descargar" }; return pintarModal(); }
  if (t.hasAttribute("data-bajar")){
    const tipo = g("data-bajar"); cerrarSheet();
    return tipo === "xlsx" ? exportarExcel() : exportarReporte();
  }
  if (t.hasAttribute("data-anular")){
    const [id, si] = g("data-anular").split("|");
    const o = S.ordSel.find(x => x.id === id); if (!o) return;
    if (si !== "si") return anularOrden(id, false);
    return confirmar("Anular la orden #" + o.num,
      "Sale del total de ventas y del conteo por producto. Puedes restaurarla después.",
      "Anular", async () => { cerrarSheet(); await anularOrden(id, true); });
  }
  if (t.id === "p0Ver"){
    const on = t.getAttribute("aria-pressed") === "true";
    t.setAttribute("aria-pressed", String(!on));
    t.textContent = !on ? "El equipo ve su avance" : "Oculto para el equipo";
    if (S.p0Draft) S.p0Draft.ver = !on;
    return;
  }
  if (t.hasAttribute("data-activo")){
    const sku = g("data-activo"), on = t.getAttribute("aria-pressed") === "true";
    t.setAttribute("aria-pressed", String(!on)); t.textContent = !on ? "En carta" : "Agotado"; return;
  }
  if (t.id === "p0Guardar") return guardarPunto0();
  if (t.id === "cartaGuardar") return guardarCarta();
  if (t.id === "confirmSi" && S.sheet && S.sheet.fn) return S.sheet.fn();
}

/* ---------- exportar ---------- */
function cargarLib(src){
  return new Promise((ok, falla) => {
    if (document.querySelector('script[data-lib="' + src + '"]')) return ok();
    const sc = document.createElement("script");
    sc.src = src; sc.setAttribute("data-lib", src);
    sc.onload = () => ok();
    sc.onerror = () => falla(new Error("no se pudo cargar la librería"));
    document.head.appendChild(sc);
  });
}
function nombreArchivo(ext){
  const f = feriaSel();
  return "potente_" + ((f && f.nombre) || "feria").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") +
    (S.diaSel === "todos" ? "_feria-completa" : "_" + S.diaSel) + "." + ext;
}

async function exportarExcel(){
  toast("Preparando el Excel…");
  if (!window.XLSX){
    try { await cargarLib("lib/xlsx-0.18.5.min.js"); }
    catch(e){ toast("No se pudo cargar el generador de Excel."); return; }
  }
  const f = feriaSel(), a = analitica(S.ordSel, S.diaSel);
  const etq = S.diaSel === "todos" ? "Toda la feria" : diaLargo(S.diaSel);
  const dias = a.porDia.map(d => d.dia);
  const wb = XLSX.utils.book_new();
  const SOL = '"S/ "#,##0.00', PCT = "0.0%";
  const hoja = (nombre, aoa, anchos, formatos) => {
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    if (anchos) ws["!cols"] = anchos.map(w => ({ wch:w }));
    if (formatos){
      const rango = XLSX.utils.decode_range(ws["!ref"]);
      for (let c = rango.s.c; c <= rango.e.c; c++){
        const z = formatos[c]; if (!z) continue;
        for (let r = rango.s.r + 1; r <= rango.e.r; r++){
          const cel = ws[XLSX.utils.encode_cell({ r, c })];
          if (cel && cel.t === "n") cel.z = z;
        }
      }
    }
    XLSX.utils.book_append_sheet(wb, ws, nombre);
  };

  hoja("Resumen", [
    ["Potente — Resumen de ventas"],
    ["Feria", f ? f.nombre : ""],
    ["Lugar", (f && f.lugar) || ""],
    ["Fechas", f ? diaLargo(f.inicio) + (f.fin && f.fin !== f.inicio ? " a " + diaLargo(f.fin) : "") : ""],
    ["Vista", etq],
    ["Generado", new Date().toLocaleString("es-PE", { timeZone:TZ })],
    [],
    ["Venta total (S/)", a.total],
    ["Órdenes", a.n],
    ["Ticket promedio (S/)", Math.round(a.ticket * 100) / 100],
    ["Unidades vendidas", a.porProducto.reduce((t, p) => t + p.unid, 0)],
    ["Producto estrella", a.porProducto.length ? a.porProducto[0].nombre : ""],
    ["Órdenes anuladas", a.anuladas],
    [],
    ["Punto 0 de la feria (S/)", (f && +f.punto0) || 0],
    ["Punto de bono (S/)", ((f && +f.punto0) || 0) * (1 + ((f && f.bonoPct != null ? +f.bonoPct : 50) / 100))],
    ["Vendido en toda la feria (S/)", a.porDia.reduce((t, d) => t + d.total, 0)],
    ["Sobre / bajo el punto 0 (S/)", a.porDia.reduce((t, d) => t + d.total, 0) - ((f && +f.punto0) || 0)],
    [],
    ["Medio de pago", "Monto (S/)", "Participación", "Órdenes", "Ticket prom. (S/)"]
  ].concat(PAGOS.map(p => {
    const v = a.pagos[p.id] || 0, n = a.pagosN[p.id] || 0;
    return [p.nombre, v, a.total ? v / a.total : 0, n, n ? Math.round(v / n * 100) / 100 : 0];
  })).concat([["Total", a.total, 1, a.n, a.n ? Math.round(a.total / a.n * 100) / 100 : 0]]), [26, 16, 14, 10, 18], { 1:SOL, 2:PCT, 4:SOL });

  const totU = a.porProducto.reduce((t, p) => t + p.unid, 0);
  hoja("Productos", [["Producto", "Categoría", "Unidades", "% de unidades", "Venta (S/)", "% de la venta"]]
    .concat(a.porProducto.slice().sort((x, y) => y.unid - x.unid).map(p =>
      [p.nombre, p.cat, p.unid, totU ? p.unid / totU : 0, p.monto, a.total ? p.monto / a.total : 0]))
    .concat([["Total", "", totU, 1, a.total, 1]]), [26, 18, 11, 15, 13, 15], { 3:PCT, 4:SOL, 5:PCT });

  const matriz = (modo, titulo) => hoja(titulo,
    [["Producto", "Categoría"].concat(dias.map(diaLargo)).concat(["Total"])]
      .concat(a.porProductoDia.map(p => [p.nombre, p.cat]
        .concat(dias.map(d => p.dias[d] ? p.dias[d][modo] : 0))
        .concat([p[modo === "unid" ? "unid" : "monto"]])))
      .concat([["Total", ""].concat(dias.map(d =>
        a.porProductoDia.reduce((t, p) => t + (p.dias[d] ? p.dias[d][modo] : 0), 0)))
        .concat([a.porProductoDia.reduce((t, p) => t + (modo === "unid" ? p.unid : p.monto), 0)])]),
    [26, 18].concat(dias.map(() => 13)).concat([13]),
    modo === "monto" ? Object.fromEntries(dias.map((_, k) => [k + 2, SOL]).concat([[dias.length + 2, SOL]])) : null);
  matriz("unid", "Unidades por día");
  matriz("monto", "Venta por día");

  const hs = []; for (let h = 9; h <= 23; h++) hs.push(h);
  hoja("Por hora", [["Hora", "Venta (S/)"]].concat(hs.map(h => [h + ":00", a.horas[h] || 0])), [10, 13], { 1:SOL });

  hoja("Producto x pago", [["Producto", "Categoría", "Unidades"].concat(PAGOS.map(p => p.nombre + " (S/)")).concat(["Total (S/)"])]
    .concat(a.porProducto.map(p => [p.nombre, p.cat, p.unid].concat(PAGOS.map(pg => p.pagos[pg.id] || 0)).concat([p.monto])))
    .concat([["Total", "", totU].concat(PAGOS.map(pg => a.pagos[pg.id] || 0)).concat([a.total])]),
    [26, 18, 11, 15, 15, 15, 15, 14], Object.fromEntries(PAGOS.map((_, k) => [k + 3, SOL]).concat([[PAGOS.length + 3, SOL]])));

  hoja("Cocina", [["Unidad preparada", "Cantidad"]].concat(a.produccion.map(x => [x[0], x[1]])), [30, 11]);

  const filas = [["Orden", "Día", "Hora", "Estado", "Medio de pago", "Producto", "Opciones", "Salsas",
                  "Nota del producto", "Cantidad", "Precio unit. (S/)", "Subtotal (S/)", "Total orden (S/)", "Nota del pedido"]];
  S.ordSel.filter(o => S.diaSel === "todos" || o.dia === S.diaSel).slice().sort((x, y) => x.num - y.num)
    .forEach(o => o.items.forEach(i => filas.push([o.num, o.dia, horaDe(new Date(o.ts)), ESTADOS[o.estado] || o.estado,
      PAGO[o.pago].nombre, i.nombre, i.detalle || "", (i.salsas || []).join(", "), i.nota || "",
      i.qty, i.precio, i.subtotal, o.total, o.nota || ""])));
  const tt = tiempos(S.ordSel, S.diaSel);
  hoja("Tiempos de cocina",
    [["Pedido", "Día", "Hora", "En cola (min)", "Preparación (min)", "Entrega (min)", "Total (min)", "Contenido"]]
      .concat(tt.filas.slice().sort((a, b) => a.o.num - b.o.num).map(r => [r.o.num, r.o.dia, horaDe(new Date(r.o.ts)),
        r.cola == null ? "" : Math.round(r.cola / 60 * 10) / 10,
        r.prep == null ? "" : Math.round(r.prep / 60 * 10) / 10,
        r.entrega == null ? "" : Math.round(r.entrega / 60 * 10) / 10,
        Math.round(r.total / 60 * 10) / 10,
        r.o.items.map(i => i.qty + "x " + i.nombre).join(", ")])),
    [8, 12, 8, 15, 18, 14, 12, 40]);

  hoja("Órdenes", filas, [8, 12, 8, 12, 18, 24, 26, 24, 22, 10, 16, 14, 16, 22], { 10:SOL, 11:SOL, 12:SOL });

  const buf = XLSX.write(wb, { bookType:"xlsx", type:"array" });
  await entregar(nombreArchivo("xlsx"), buf);
}

    "</style></head><body><div class=\"wrap\">" +
    '<div class="rep-h"><div class="logomark" role="img" aria-label="Potente"></div>' +
      "<div><h2 style=\"font-size:24px\">" + esc(f ? f.nombre : "Feria") + "</h2>" +
      '<div style="color:var(--ink-2);font-size:13.5px">' +
        (f && f.lugar ? esc(f.lugar) + " · " : "") +
        (f ? diaLargo(f.inicio) + (f.fin && f.fin !== f.inicio ? " → " + diaLargo(f.fin) : "") : "") +
        " · Vista: " + esc(etq) + "</div></div>" +
      '<span style="flex:1"></span>' +
      '<div style="color:var(--ink-3);font-size:12px;text-align:right">Generado el<br>' +
        new Date().toLocaleString("es-PE", { timeZone:TZ }) + "</div></div>" +
    clon.innerHTML + "</div></body></html>";
  await entregar(nombreArchivo("html"), doc);
}
