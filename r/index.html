<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>CUANTICS</title>
<link rel="icon" href="/favicon.svg">
<style>
  :root { --ink:#14212E; --teal:#13B0C1; --teal-dark:#0E8F9E; --muted:#5B6874; --trace:#C3CDD4; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px 16px;
         background:#fff; color:var(--ink); font-family:'Segoe UI',Arial,Helvetica,sans-serif; }
  main { width:100%; max-width:420px; text-align:left; }
  img { display:block; width:240px; height:auto; margin:0 0 28px; }
  p { margin:0 0 10px; font-size:15px; line-height:1.5; }
  .muted { color:var(--muted); font-size:13px; }
  .bar { height:2px; width:100%; background:var(--trace); overflow:hidden; margin:18px 0 22px; }
  .bar span { display:block; height:100%; width:35%; background:var(--teal); animation:run 1.1s ease-in-out infinite; }
  @keyframes run { from { transform:translateX(-100%); } to { transform:translateX(290%); } }
  @media (prefers-reduced-motion: reduce) { .bar span { animation:none; width:100%; } }
  a { color:var(--teal-dark); font-weight:600; }
</style>
</head>
<body>
<main>
  <img src="/img/firma/logo_firma.png" alt="CUANTICS" width="240" height="18">
  <p>Abriendo el documento…</p>
  <div class="bar" aria-hidden="true"><span></span></div>
  <p class="muted">Si no se abre solo, <a id="enlace" href="https://cuantics.pe/">continúa aquí</a>.</p>
</main>
<script>
  // Enlaces con seguimiento: cuantics.pe/r/?c=<código>
  // Anota el clic en Supabase (función enlace_clic) y redirige SOLO al destino guardado para ese código.
  (function () {
    var porDefecto = 'https://cuantics.pe/';
    var c = (new URLSearchParams(location.search).get('c') || '').toLowerCase();
    var listo = false;
    var ir = function (url) {
      if (listo) return; listo = true;
      var ok = typeof url === 'string' && (/^https:\/\//.test(url) || /^\/[^\/]/.test(url));
      var destino = ok ? url : porDefecto;
      document.getElementById('enlace').href = destino;
      location.replace(destino);
    };
    if (!/^[a-z0-9]{6,32}$/.test(c)) { ir(porDefecto); return; }
    setTimeout(function () { ir(porDefecto); }, 6000);  // si la base no responde, al menos llega a la web
    fetch('https://gsjeyqccxwefbetxgutn.supabase.co/rest/v1/rpc/enlace_clic', {
      method: 'POST', keepalive: true,
      headers: { 'apikey': 'sb_publishable_K88L7Q54xZAFmFz-DqrAwQ_LeU0Cm7J', 'Content-Type': 'application/json' },
      body: JSON.stringify({ p_codigo: c })
    }).then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) { ir(d); }, function () { ir(porDefecto); });
  })();
</script>
</body>
</html>
