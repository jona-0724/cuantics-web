<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Retos de planta y soluciones · CUANTICS</title>
<link rel="icon" href="/favicon.svg">
<style>
  :root { --ink:#14212E; --teal:#13B0C1; --teal-dark:#0E8F9E; --muted:#5B6874; --trace:#C3CDD4; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px 16px;
         background:#fff; color:var(--ink); font-family:'Segoe UI',Arial,Helvetica,sans-serif; }
  main { width:100%; max-width:420px; text-align:left; }
  img { display:block; width:240px; height:auto; margin:0 0 28px; }
  p { margin:0 0 10px; font-size:15px; line-height:1.5; }
  .muted { color:var(--muted); font-size:13px; }
  .bar { height:2px; width:100%; background:var(--trace); overflow:hidden; margin:18px 0 22px; }
  .bar span { display:block; height:100%; width:35%; background:var(--teal); animation:run 1.1s ease-in-out infinite; }
  @keyframes run { from { transform:translateX(-100%); } to { transform:translateX(290%); } }
  @media (prefers-reduced-motion: reduce) { .bar span { animation:none; width:100%; } }
  a { color:var(--teal-dark); font-weight:600; }
</style>
</head>
<body>
<main>
  <img src="/img/firma/logo_firma.png" alt="CUANTICS" width="240" height="18">
  <p>Abriendo la hoja de 8 retos de planta y cómo los resolvemos…</p>
  <div class="bar" aria-hidden="true"><span></span></div>
  <p class="muted">Si no se abre sola, <a id="enlace" href="/docs/flyer-retos-de-planta.pdf">ábrela aquí</a>.</p>
</main>
<script>
  // Anota la apertura (solo si el enlace trae un código válido) y después muestra el PDF.
  (function () {
    var pdf = '/docs/flyer-retos-de-planta.pdf';
    var c = new URLSearchParams(location.search).get('c') || '';
    var ir = function () { location.replace(pdf); };
    if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(c)) { ir(); return; }
    var listo = false, seguir = function () { if (!listo) { listo = true; ir(); } };
    setTimeout(seguir, 1500);  // si Supabase tarda, igual se abre el PDF
    fetch('https://gsjeyqccxwefbetxgutn.supabase.co/rest/v1/rpc/cold_mail_flyer_open', {
      method: 'POST', keepalive: true,
      headers: { 'apikey': 'sb_publishable_K88L7Q54xZAFmFz-DqrAwQ_LeU0Cm7J', 'Content-Type': 'application/json' },
      body: JSON.stringify({ p_token: c })
    }).then(seguir, seguir);
  })();
</script>
</body>
</html>
