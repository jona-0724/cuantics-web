<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bry Care — Acceso privado</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="img/favicon-32.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F4EEE6; --cream-2:#EADFCF; --taupe:#C9A98D; --rose:#C08363;
    --rose-2:#D9A184; --olive:#8A6F1E; --ink:#3B332B; --muted:#7A6E60; --line:#DCCBB5;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(1100px 700px at 80% -10%, var(--cream-2), var(--cream) 60%);
    font-family:"Poppins",system-ui,sans-serif;color:var(--ink);padding:24px}
  .card{width:100%;max-width:400px;background:#fff;border:1px solid var(--line);
    border-radius:18px;padding:40px 34px 34px;box-shadow:0 30px 60px -25px rgba(90,60,30,.25);text-align:center}
  .logo{width:150px;height:auto;margin:0 auto 6px;display:block}
  h1{font-family:"Playfair Display",serif;font-weight:600;font-size:20px;margin:10px 0 6px;color:var(--ink)}
  p.sub{font-size:13px;color:var(--muted);margin:0 0 26px;line-height:1.5}
  form{text-align:left}
  label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
  .field{margin-bottom:16px}
  input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;
    font-family:inherit;font-size:14.5px;background:#FBF8F3;color:var(--ink);outline:none;
    transition:border-color .2s, background .2s}
  input:focus{border-color:var(--rose);background:#fff}
  .btn{width:100%;margin-top:6px;padding:13px 16px;border:none;border-radius:10px;
    background:linear-gradient(120deg,var(--rose),var(--rose-2));color:#fff;font-family:inherit;
    font-size:14px;font-weight:500;letter-spacing:.03em;cursor:pointer;transition:filter .2s, transform .2s}
  .btn:hover{filter:brightness(1.06)}
  .btn:active{transform:scale(.99)}
  .error{display:none;background:#FBEAE6;color:#A2402A;border:1px solid #F0C9BE;font-size:12.5px;
    padding:10px 12px;border-radius:8px;margin-bottom:16px}
  .error.show{display:block}
  .foot{margin-top:26px;font-size:11px;color:var(--muted)}
  .dfly{width:20px;height:auto;opacity:.55;margin-top:18px}
</style>
</head>
<body>

<div class="card">
  <img class="logo" src="img/logo.png" alt="Bry Care — Wellness · Detox · Beauty">
  <h1>Acceso privado</h1>
  <p class="sub">Esta página es solo para invitados. Ingresa tu usuario y contraseña para continuar.</p>

  <div class="error" id="err">Usuario o contraseña incorrectos. Inténtalo de nuevo.</div>

  <form id="gateForm" autocomplete="off">
    <div class="field">
      <label for="u">Usuario</label>
      <input id="u" name="u" type="text" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="p">Contraseña</label>
      <input id="p" name="p" type="password" autocomplete="current-password" required>
    </div>
    <button class="btn" type="submit">Ingresar</button>
  </form>

  <div class="foot">Bry Care · Wellness · Detox · Beauty</div>
</div>

<script>
(function(){
  // Nota: verificación en el cliente — suficiente para mantener fuera a
  // visitantes casuales, no para proteger información sensible.
  var USER = "Brycare", PASS = "Melon2026";
  var form = document.getElementById('gateForm');
  var err = document.getElementById('err');

  // Si ya se autenticó en esta pestaña/sesión, pasa directo.
  try{
    if(sessionStorage.getItem('brycareAuth') === '1'){
      location.replace('experiencia.html');
    }
  }catch(e){}

  form.addEventListener('submit', function(ev){
    ev.preventDefault();
    var u = document.getElementById('u').value.trim();
    var p = document.getElementById('p').value;
    if(u === USER && p === PASS){
      try{ sessionStorage.setItem('brycareAuth','1'); }catch(e){}
      location.href = 'experiencia.html';
    }else{
      err.classList.add('show');
    }
  });
})();
</script>
</body>
</html>
