<!doctype html>
<html lang="es-PE">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A3324">
<title>MiPlata</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MiPlata">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script>
  // App instalable: service worker y aviso de instalación (Android/Chrome/Edge)
  if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); window.__instalarMiPlata = e; });
</script>
<script>
  // Tema antes de pintar (evita parpadeo): auto | claro | oscuro
  try { const t = localStorage.getItem('miplata.tema'); if (t === 'claro' || t === 'oscuro') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css">
<link rel="stylesheet" href="estilo-v1.css">
</head>
<body>
<div class="app" id="app">
  <div class="cargando">Cargando…</div>
</div>

<!-- Logo: billetera con tarjeta, dentro de una flecha circular -->
<template id="tpl-logo">
  <svg viewBox="0 0 64 64" aria-hidden="true">
    <defs>
      <linearGradient id="lg-anillo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5BE3A0"/><stop offset="1" stop-color="#1FAE6A"/></linearGradient>
      <linearGradient id="lg-billetera" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#CDEFD9"/></linearGradient>
    </defs>
    <path d="M55.3 43.6A26 26 0 1 1 52.2 15.3" fill="none" stroke="url(#lg-anillo)" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M56.6 29.2l-7.3 9.6h14.4z" fill="#3DD68C"/>
    <rect x="21" y="15.5" width="20" height="11" rx="2.5" fill="#3DD68C" transform="rotate(-14 31 21)"/>
    <rect x="23.5" y="17.6" width="12" height="2" rx="1" fill="#1FAE6A" transform="rotate(-14 31 21)"/>
    <rect x="15" y="23" width="30" height="21" rx="6" fill="url(#lg-billetera)"/>
    <rect x="35" y="29" width="12" height="9" rx="4.5" fill="#0F4A33"/>
    <circle cx="40.5" cy="33.5" r="2" fill="#FFFFFF"/>
  </svg>
</template>

<!-- Ilustración: celular con barras que crecen y moneda de sol -->
<template id="tpl-ilustra">
  <svg viewBox="0 0 220 190" aria-hidden="true">
    <defs>
      <linearGradient id="il-barra" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#1FAE6A"/><stop offset="1" stop-color="#5BE3A0"/></linearGradient>
      <radialGradient id="il-oro" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#FFE38A"/><stop offset=".55" stop-color="#F5C542"/><stop offset="1" stop-color="#C98F16"/></radialGradient>
    </defs>
    <g transform="rotate(-9 110 95)">
      <rect x="52" y="8" width="112" height="170" rx="20" fill="#3DD68C" fill-opacity=".14" stroke="#3DD68C" stroke-opacity=".45" stroke-width="2"/>
      <rect x="62" y="22" width="92" height="142" rx="12" fill="#3DD68C" fill-opacity=".10"/>
      <rect x="92" y="13" width="32" height="4" rx="2" fill="#3DD68C" fill-opacity=".45"/>
      <rect x="72" y="122" width="14" height="26" rx="3" fill="url(#il-barra)"/>
      <rect x="92" y="104" width="14" height="44" rx="3" fill="url(#il-barra)"/>
      <rect x="112" y="84" width="14" height="64" rx="3" fill="url(#il-barra)"/>
      <rect x="132" y="58" width="14" height="90" rx="3" fill="url(#il-barra)"/>
    </g>
    <path d="M58 140 L96 112 L122 120 L178 58" fill="none" stroke="#3DD68C" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M186 46 L164 54 L182 72 Z" fill="#3DD68C"/>
    <circle cx="168" cy="140" r="32" fill="url(#il-oro)"/>
    <circle cx="168" cy="140" r="24" fill="none" stroke="#B37D0E" stroke-opacity=".55" stroke-width="2"/>
    <text x="168" y="150" text-anchor="middle" font-family="Poppins, sans-serif" font-weight="800" font-size="27" fill="#8F5F06">S/</text>
    <path d="M204 104 l9 -9 M208 122 h11" stroke="#3DD68C" stroke-width="4" stroke-linecap="round"/>
  </svg>
</template>

<script src="../lib/supabase-2.45.4.min.js"></script>
<script src="config.js"></script>
<script src="jerga.js"></script>
<script src="interprete.js"></script>
<script src="app.js"></script>
</body>
</html>
